[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-phi-bert"
version = "0.1.0"
description = "Sequence evidence processing for the CRISPRPHIBert research workflow"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
statistics = ["numpy>=1.26,<3", "scikit-learn>=1.2,<2"]
encoder = ["torch>=2.6,<3", "transformers>=4.50,<5"]

[tool.setuptools.packages.find]
include = ["crisprphibert*"]
