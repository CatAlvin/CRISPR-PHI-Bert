name: Sequence evidence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[statistics]'
      - run: python -m unittest discover -s tests -v
      - run: python -m crisprphibert --demo --outdir demo-output
      - run: python scripts/verify_demo.py --output demo-output
      - run: python scripts/score_embeddings.py --output demo-output/statistics.json
